# Paths to data files
# This example provides multiple paths to give several examples, but only one can be provided,
# or be provided through --mission-products-folder
# Format using %Y, %m, %d and %H should be used in the paths to let the program find the files for the given date.
# The day of year can be used with %(dayOfYear) in the path.
paths:
  SMOS:
    - '/home/ref-smoswind-public/data/v3.0/l3/data/reprocessing/%Y/%(dayOfYear)/*%Y%m%d*.nc'
    - '/home/ref-smoswind-public/data/v3.0/l3/data/nrt/%Y/%(dayOfYear)/*%Y%m%d*.nc'
