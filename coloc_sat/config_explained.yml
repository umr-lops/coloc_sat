# Variables to load for each mission
# The dict key is the mission_name as specified in the mission_name method in the 
# meta class of the mission product (ie. "Soil Moisture and Ocean Salinity")
# The list values are the variables names in the loaded file to keep.
# Lon/lat and time are always loaded, so they don't need to be specified here.
# If nothing is specified for a mission, all variables are loaded.
load_variables:
  "Soil Moisture and Ocean Salinity":
    - wind_speed
    - measurement_time
  "RADARSAT Constellation 2":
    - wind_speed
    - wind_from_direction
    - time

# Dict to rename variables
# This is used by some of the meta mission classes, but not thoroughly implemented yet.
# (ie. rename_vars_in_coloc in smap_meta.py)
common_var_names:
  wind_speed: wind_speed
  wind_direction: wind_direction_ecmwf
  wind_from_direction: wind_from_direction
  longitude: lon
  latitude: lat
  time: time

