name: Upload package to PyPI and conda

on:
  release:
    types: [created]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install setuptools_scm
        run: pip install setuptools_scm
      - name: Write version to file
        run: python -c "import setuptools_scm; print(f'__version__ = \\'{setuptools_scm.get_version()}\\'', file=open('coloc_sat/version.py', 'w'))"
      - name: Update system package index
        run: sudo apt update
      - name: Install system packages
        run: sudo apt-get install -y libgdal-dev
      - name: Setup Environment Variables
        run: echo "GDAL_CONFIG=/usr/bin/gdal-config" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install GDAL==`gdal-config --version`
      - name: Build
        run: |
          python -m build --sdist --wheel .
      - name: Check the built archives
        run: |
          twine check dist/*
          pip install dist/*.whl
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.pypi_token }}
          repository_url: https://upload.pypi.org/legacy/
          verify_metadata: true

  build-and-upload:
    runs-on: ubuntu-latest
    env:
      GIT_DESCRIBE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: build-env
          create-args: >-
            python=3.11
            conda-build
            anaconda-client
            setuptools_scm
          cache-environment: true
          init-shell: bash

      - name: Build package
        run: conda build recipe/ --no-test

      - name: Upload to Anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          anaconda -t $ANACONDA_API_TOKEN upload \
            --user Oceanscope \
            $(conda build recipe/ --output --no-test)
